# Project-wide Gradle settings.

# Reuse task outputs across builds instead of recompiling from scratch. This
# was a no-op on CI until the workflow moved to gradle/actions/setup-gradle:
# setup-java's cache skipped saving on a key hit, so the build cache never
# survived a run. Pays off from the *second* run onward.
org.gradle.caching=true

# 3GB, up from 2GB: the CI runner has 7GB and a Compose build at 2GB spends
# real time in GC. Left below half the runner so the Kotlin compile daemon,
# which gets its own heap, isn't squeezed into swapping.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
